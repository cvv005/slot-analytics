<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大選房平台 - 個人管理後台</title>
    <style>
        body { background: #0c0507; color: #fff; font-family: sans-serif; padding: 20px; max-width: 650px; margin: 0 auto; }
        h2 { color: #ff0015; border-bottom: 2px solid #ff0015; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ffb700; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 10px; background: #1a0a0d; border: 1px solid #ff0015; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff0015; color: #fff; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        button:hover { background: #cc0011; }
        .strategy-box { background: #1a0a0d; border: 1px dashed #ff0015; padding: 12px; margin-bottom: 12px; border-radius: 6px; }
        .btn-del { background: #441111; color: #ff8888; border: 1px solid #ff4444; padding: 4px 8px; font-size: 0.8rem; float: right; margin-top: -5px; }
        .hint { font-size: 0.75rem; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>
    <h2>🐂 牛老大 - 後台控制中心</h2>
    
    <div class="form-group">
        <label>🔑 GitHub Access Token (PAT):</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxx">
        <div class="hint">僅儲存於您的瀏覽器本機。</div>
    </div>

    <div class="form-group">
        <label>📢 前端跑馬燈公告內容：</label>
        <textarea id="marqueeInput" rows="2"></textarea>
    </div>

    <div class="form-group">
        <label>📈 爆分率全域加成 (%)：</label>
        <input type="number" id="boostInput" step="0.1" value="0.0">
    </div>

    <hr style="border-color: #331115; margin: 20px 0;">

    <h3>🎯 各遊戲專屬打法管理</h3>
    <div id="strategiesContainer"></div>
    <button onclick="addStrategyField()" style="background:#0088cc; width:100%; margin-bottom:15px;">＋ 新增一組遊戲打法</button>

    <button onclick="saveData()" style="width:100%; padding:15px; font-size: 1.1rem;">💾 儲存並同步至前端</button>
    <p id="statusMsg" style="text-align:center; color:#00ff66; font-weight:bold; margin-top:15px;"></p>

    <script>
        const REPO = "cvv005/slot-analytics";
        const PATH = "data.json";

       // 遊戲清單（正確完整清單）
        const GAME_OPTIONS = [
            // --- ATG 系統 ---
            { id: "atg_seth1", name: "🎰 ATG 戰神賽特1" },
            { id: "atg_seth2", name: "🎰 ATG 戰神賽特2" },
            { id: "atg_tiger", name: "🐯 ATG 虎小妹" },
            { id: "atg_sanguo", name: "⚔️ ATG 赤三國" },
            { id: "atg_baphomet", name: "🐐 ATG 古神巴風特" },

            // --- RSG 系統 ---
            { id: "rsg_thor1", name: "⚡ RSG 雷神之錘1" },
            { id: "rsg_thor2", name: "⚡ RSG 雷神之錘2" },
            { id: "rsg_lubu", name: "🏹 RSG 戰神呂布" },

            // --- 通用類 ---
            { id: "general", name: "🌐 通用全遊戲打法" }
        ];

        window.onload = async () => {
            const savedToken = localStorage.getItem('gh_pat_token');
            if (savedToken) document.getElementById('ghToken').value = savedToken;

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${PATH}?t=${Date.now()}`);
                const data = await res.json();
                document.getElementById('marqueeInput').value = data.marquee || '';
                document.getElementById('boostInput').value = data.customRateBoost || 0;
                
                if (data.gameStrategies && Array.isArray(data.gameStrategies)) {
                    data.gameStrategies.forEach(s => addStrategyField(s.gameId, s.title, s.content));
                } else if (data.strategies && Array.isArray(data.strategies)) {
                    // 相容舊資料
                    data.strategies.forEach(s => addStrategyField("atg_seth2", s.title, s.content));
                }
            } catch(e) {
                console.log('載入資料失敗:', e);
            }
        };

        function addStrategyField(gameId = 'atg_seth2', title = '', content = '') {
            const container = document.getElementById('strategiesContainer');
            const div = document.createElement('div');
            div.className = 'strategy-box';
            
            let optionsHtml = GAME_OPTIONS.map(g => 
                `<option value="${g.id}" ${g.id === gameId ? 'selected' : ''}>${g.name}</option>`
            ).join('');

            div.innerHTML = `
                <button class="btn-del" onclick="this.parentElement.remove()">🗑️ 刪除</button>
                <label>選擇所屬遊戲：</label>
                <select class="strat-game-id" style="margin-bottom:8px;">
                    ${optionsHtml}
                </select>
                <label>打法名稱：</label>
                <input type="text" class="strat-title" value="${title}" placeholder="例如：三階段打法" style="margin-bottom:8px;">
                <label>打法詳細內容：</label>
                <textarea class="strat-content" rows="4" placeholder="請輸入該遊戲的具體打法步驟...">${content}</textarea>
            `;
            container.appendChild(div);
        }

        async function saveData() {
            const token = document.getElementById('ghToken').value.trim();
            const marquee = document.getElementById('marqueeInput').value;
            const boost = parseFloat(document.getElementById('boostInput').value) || 0;
            const msgEl = document.getElementById('statusMsg');

            if (!token) {
                alert('請輸入 GitHub Access Token！');
                return;
            }
            localStorage.setItem('gh_pat_token', token);
            msgEl.innerText = "⏳ 正在同步更新至 GitHub...";

            const gameStrategies = [];
            document.querySelectorAll('.strategy-box').forEach(box => {
                const gId = box.querySelector('.strat-game-id').value;
                const t = box.querySelector('.strat-title').value;
                const c = box.querySelector('.strat-content').value;
                if (t || c) gameStrategies.push({ gameId: gId, title: t, content: c });
            });

            try {
                const getFileRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const fileData = await getFileRes.json();
                const sha = fileData.sha;

                const updatedContent = {
                    marquee,
                    customRateBoost: boost,
                    gameStrategies,
                    updatedAt: new Date().toLocaleString()
                };

                const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "更新專屬遊戲打法資料",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedContent, null, 2)))),
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    msgEl.innerText = "✅ 遊戲專屬打法已成功同步！";
                } else {
                    msgEl.innerText = "❌ 更新失敗，請檢查 Token 是否正確。";
                }
            } catch(err) {
                msgEl.innerText = "❌ 系統錯誤: " + err.message;
            }
        }
    </script>
</body>
</html>
